['🏛️','அமெரிக்கா: கட்டமைப்பு',['காங்கிரஸ்: பிரதிநிதிகள் சபை + செனட் (மாநிலத்துக்கு 2 வீதம் 100 பேர்)','நிறைவேற்றுத்துறை: ஜனாதிபதி','நீதித்துறை: சமஷ்டி உயர் நீதிமன்றம்','யாப்புத் திருத்தம்: காங்கிரஸின் 2/3 பெரும்பான்மை + 3/4 மாநிலங்களின் ஒப்புதல்']],
['🇨🇭','சுவிட்சர்லாந்து: தோற்றம்',['1848 அரசியலமைப்புச் சீர்திருத்தத்தால் அமைந்தது','பிராந்திய அலகுகள் “கண்டன்” (Canton); தற்போது 26']],
['🏛️','சுவிட்சர்லாந்து: கட்டமைப்பு',['சட்டவாக்கம்: சமஷ்டிப் பேரவை (தேசிய சபை + அரச சபை)','நிறைவேற்று: 7 பேர் கொண்ட சமஷ்டி சபை (Federal Council); சமஷ்டிப் பேரவை நியமிக்கும்','தலைவர் ஏனையோரைவிட மேன்மையானவர் அல்லர் (கூட்டு நிறைவேற்று அதிகாரம்)']]]},
{t:'ஒப்பீடு 5: அமெரிக்கா × சுவிட்சர்லாந்து',tb:1,h:['அம்சம்','ஐக்கிய அமெரிக்கா','சுவிட்சர்லாந்து'],r:[
['மாநிலங்கள்','50 மாநிலங்கள் (States)','26 கண்டன்கள் (Cantons)'],
['நிறைவேற்றுத்துறை','ஒற்றை நபர் நிறைவேற்று அதிகாரம் (ஜனாதிபதி)','7 பேர் கொண்ட கூட்டு நிறைவேற்றுச் சபை'],
['சட்டவாக்கத்துறை','காங்கிரஸ் (பிரதிநிதிகள் சபை + செனட்)','சமஷ்டிப் பேரவை (தேசிய சபை + அரச சபை)'],
['மேலவை பிரதிநிதித்துவம்','செனட்டுக்கு மாநிலத்துக்கு 2 வீதம், 100 பேர்','அரச சபைக்குக் கண்டன்களிலிருந்து பிரதிநிதிகள்']]}
];
var n=0,seen={};
var $=function(i){return document.getElementById(i)};
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function show(i){
  n=Math.max(0,Math.min(S.length-1,i));var s=S[n],h='',d=0,tot;
  $('t').textContent=s.t;
  if(s.tb){
    tot=s.r.length;
    h='<table><thead><tr>'+s.h.map(function(x){return '<th>'+esc(x)+'</th>'}).join('')+'</tr></thead><tbody>'+
    s.r.map(function(r,i2){return '<tr data-r="'+i2+'" class="'+(seen[n+'-'+i2]?'seen':'')+'" style="--d:'+(0.15*i2+.2).toFixed(2)+'s">'+r.map(function(c){return '<td>'+esc(c)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table>';
  }else{
    tot=s.it.length;
    s.it.forEach(function(it,k){
      h+='<button class="tile '+(it[4]||s.cls||'')+(seen[n+'-'+k]?' seen':'')+'" style="--c:'+COL[k%6]+';--d:'+(d+=.1).toFixed(2)+'s" data-k="'+k+'"><span class="ic">'+it[0]+'</span>'+it[1]+(it[3]?'<small>'+it[3]+'</small>':'')+'</button>';
      if(k<tot-1&&((s.sep&&s.sep[k])||s.arrow))h+='<span class="sep" style="--d:'+(d+=.1).toFixed(2)+'s">'+(s.arrow?'→':s.sep[k])+'</span>';
      if(s.br&&s.br.indexOf(k)>-1)h+='<span class="br"></span>';
    });
  }
  $('g').innerHTML=h;
  var c=0;for(var j=0;j<tot;j++)if(seen[n+'-'+j])c++;
  $('hint').textContent='👆 '+(s.tb?'ஒரு வரிசையைத் தொடுங்கள்':'ஒவ்வொன்றையும் தொடுங்கள்')+' ('+c+'/'+tot+')';
  var dots='';for(var q=0;q<S.length;q++)dots+='<i data-n="'+q+'"'+(q==n?' class="on"':'')+'></i>';
  $('dots').innerHTML=dots;
  $('pv').disabled=n==0;$('nx').disabled=n==S.length-1;
}
function open_(k,ic,name,lines,html){
  seen[n+'-'+k]=1;
  $('card').style.setProperty('--c',COL[k%6]);
  $('ci').textContent=ic;$('ch').textContent=name;
  $('cl').innerHTML=lines.map(function(l,j){return '<li style="animation-delay:'+(j*.12)+'s">'+(html?l:esc(l))+'</li>'}).join('');
  var len=lines.join('').length;
  $('card').className=len>520?'xs':len>300?'sm':'';
  $('pop').classList.add('show');
}
function close_(){$('pop').classList.remove('show');show(n)}
$('g').addEventListener('click',function(e){
  var b=e.target.closest('.tile'),r=e.target.closest('tr[data-r]'),s=S[n];
  if(b){var k=+b.dataset.k,it=s.it[k];open_(k,it[0],it[1],it[2],it[5])}
  else if(r){var i=+r.dataset.r,row=s.r[i];
    open_(i,'🔍',row[0],row.slice(1).map(function(c,j){return '<b>'+esc(s.h[j+1])+'</b>: '+esc(c)}),1)}
});
$('pop').addEventListener('click',function(e){if(e.target.id=='pop'||e.target.id=='x')close_()});
$('pv').onclick=function(){show(n-1)};$('nx').onclick=function(){show(n+1)};
$('dots').addEventListener('click',function(e){if(e.target.dataset.n)show(+e.target.dataset.n)});
document.addEventListener('keydown',function(e){
  if(e.key=='Escape')close_();
  else if(!$('pop').classList.contains('show')){if(e.key=='ArrowRight')show(n+1);if(e.key=='ArrowLeft')show(n-1)}
});
var x0=null;
document.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',function(e){
  if(x0===null||$('pop').classList.contains('show'))return;
  var dx=e.changedTouches[0].clientX-x0;x0=null;
  if(Math.abs(dx)>70)show(n+(dx<0?1:-1));
},{passive:true});
function fit(){
  var w=innerWidth,h=innerHeight,por=w/h<1,W=por?1080:1920,H=por?1920:1080,k=Math.min(w/W,h/H),cv=$('cv');
  cv.style.width=W+'px';cv.style.height=H+'px';
  cv.style.transform='translate('+(-W*k/2)+'px,'+(-H*k/2)+'px) scale('+k+')';
}
addEventListener('resize',fit);fit();
show(0);
</script>
</body>
</html>
